# Application name and port configuration
spring.application.name=loan-service
server.port=8080

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3316/loan_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
-
# Flyway migration configuration
spring.flyway.enabled=true

# Actuator endpoints configuration for monitoring and management
management.endpoints.web.exposure.include=health,info,prometheus,env,configprops
management.endpoint.health.show-details=always

# Logging configuration
logging.level.com.amir.loan_service=INFO
