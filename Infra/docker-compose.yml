version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysqldb
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "3316:3306"
    volumes:
      - ./MySql/mysql-data:/var/lib/mysql
      - ./MySql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
